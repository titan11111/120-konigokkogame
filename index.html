<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hide and Seek - Stealth Escape</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="ui-layer">
            <div id="alert-gauge" class="ui-element">
                <div class="gauge-label">Alert Level</div>
                <div class="gauge-bar">
                    <div id="alert-level" class="gauge-fill"></div>
                </div>
                <div id="alert-status">Safe</div>
            </div>
            
            <div id="player-status" class="ui-element">
                <div>Health: <span id="health">100</span>%</div>
                <div>Location: <span id="location">Downtown</span></div>
            </div>
            
            <div id="mission-info" class="ui-element">
                <div class="mission-title">Mission</div>
                <div id="mission-text">Escape home without being caught</div>
                <div id="timer">Time: <span id="time-left">300</span>s</div>
            </div>
        </div>
        
        <canvas id="game-canvas"></canvas>
        
        <div id="game-over" class="overlay hidden">
            <div class="overlay-content">
                <h1 id="game-over-title">Game Over</h1>
                <p id="game-over-message"></p>
                <button onclick="location.reload()">Restart</button>
            </div>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
